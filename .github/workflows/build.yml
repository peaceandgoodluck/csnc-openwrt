name: Build csnc (Netcore N30 Pro) OpenWrt 25.12.6

on:
  workflow_dispatch:

env:
  OPENWRT_TAG: v25.12.6
  OPENWRT_SHA: 64900e756efa667774214f9c6b17c113222e01f7
  OPENCLASH_SHA: e553e82e01c697aefbe1555261a503f425e00ccd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison \
            g++ gawk gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Clone OpenWrt (pinned tag + SHA check)
        run: |
          git clone --depth 1 -b "$OPENWRT_TAG" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          test "$(git rev-parse HEAD)" = "$OPENWRT_SHA"
          echo "OpenWrt HEAD OK: $(git rev-parse HEAD)"

      - name: Apply N30 Pro backport patch
        run: |
          cd openwrt
          git apply --check ../patches/n30pro-25.12.6.patch
          git apply ../patches/n30pro-25.12.6.patch
          git status --short

      - name: Add OpenClash (pinned commit)
        run: |
          git init -q oc
          cd oc
          git remote add origin https://github.com/vernesong/OpenClash.git
          git fetch -q --depth 1 origin "$OPENCLASH_SHA"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$OPENCLASH_SHA"
          cp -r luci-app-openclash ../openwrt/package/

      - name: Feeds (GitHub mirrors, pinned commits)
        run: |
          cd openwrt
          sed -e 's#git.openwrt.org/feed/#github.com/openwrt/#' \
              -e 's#git.openwrt.org/project/#github.com/openwrt/#' \
              feeds.conf.default > feeds.conf
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cp ../seed.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y' .config
          for p in luci-app-openclash dnsmasq-full frpc luci-ssl \
                   kmod-nft-tproxy kmod-tun kmod-mt7915e; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "MISSING $p"; exit 1; }
          done
          if grep -q '^CONFIG_RUBY_ENABLE_YJIT=y' .config; then
            echo "YJIT enabled (would pull in rust/host)"; exit 1
          fi
          echo "config OK"

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          nproc; free -h; df -h /
          make -j"$(nproc)"

      - name: Show failed package logs
        if: failure()
        run: |
          cd openwrt
          df -h /
          grep -rlE 'Error [0-9]|error:' logs 2>/dev/null | head -n 5 |
          while read -r f; do
            echo "=================== $f"
            tail -n 80 "$f"
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: openwrt/logs/
          retention-days: 7

      - name: Collect outputs
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          ls -la
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp *netcore_n30-pro* config.buildinfo feeds.buildinfo \
             version.buildinfo "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"
          {
            echo "openwrt=$OPENWRT_TAG $OPENWRT_SHA"
            echo "openclash=$OPENCLASH_SHA"
            echo "patch=$(sha256sum ../patches/n30pro-25.12.6.patch)"
          } > SOURCES.txt
          sha256sum * > SHA256SUMS
          cat SOURCES.txt SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csnc-openwrt-25.12.6
          path: out/
          retention-days: 30
